# Repo-wide lint config for backend/ and e2e/ (research-agent/ has its own in pyproject.toml).
line-length = 140
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is the framework's idiom

[lint.per-file-ignores]
# Tests and the integration harness favour compact, readable scenarios over strict style.
"backend/tests/**" = ["E702", "E731", "B017", "B905", "B007", "I001", "F841"]
"e2e/**" = ["E702", "E731", "B007", "I001"]
"backend/alembic/**" = ["I001"]
