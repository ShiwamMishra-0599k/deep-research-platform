# Required secrets (compose refuses to start without them):
#   JWT_SECRET      openssl rand -base64 48
#   AGENT_API_KEY   openssl rand -base64 32   (shared by backend and research-agent)
# Copy .env.example to .env (git-ignored) and fill them in.

services:
  postgres:
    image: postgres:16-alpine
    container_name: lumen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lumen
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen   # development default; see SECURITY_REVIEW.md before any shared deployment
    ports:
      - "127.0.0.1:5433:5432"    # loopback only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen -d lumen"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lumen-redis
    restart: unless-stopped
    # Cache only: bounded memory, no persistence needed. Not published to the host (no auth).
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  research-agent:
    build:
      context: ./research-agent
      dockerfile: Dockerfile
    container_name: lumen-research-agent
    restart: unless-stopped
    env_file:
      - ./research-agent/.env
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 8004
      AGENT_API_KEY: ${AGENT_API_KEY:?set AGENT_API_KEY (openssl rand -base64 32)}
    # No `ports:` on purpose. The agent is reachable only from the backend over the
    # compose network and additionally requires the X-Internal-Token header.
    expose:
      - "8004"
    depends_on:
      redis:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lumen-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://lumen:lumen@postgres:5432/lumen
      RESEARCH_AGENT_URL: http://research-agent:8004
      AGENT_API_KEY: ${AGENT_API_KEY:?set AGENT_API_KEY (openssl rand -base64 32)}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -base64 48)}
      JWT_EXPIRATION_MINUTES: 1440
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "127.0.0.1:8080:8080"    # loopback only; put a TLS-terminating proxy in front for real use
    depends_on:
      postgres:
        condition: service_healthy
      research-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
